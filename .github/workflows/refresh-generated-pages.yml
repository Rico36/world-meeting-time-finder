name: Refresh generated pages

# The 479 pages under time/ and holidays/ embed holiday lists that are a
# snapshot of "upcoming" at the moment they were generated. The at-a-glance
# "next public holiday" recomputes itself in the browser so nothing on screen
# is ever wrong, but the *lists themselves* only move forward when the pages
# are rebuilt, and a page still listing four holidays that have all passed is
# no use to anyone.
#
# MONTHLY, not quarterly, and it commits straight to main. Both of those are
# deliberate:
#
#   * GitHub disables scheduled workflows after 60 days with no commit
#     activity in the repo. A quarterly schedule has 90-day gaps, so it would
#     switch itself off before its second run - the automation would quietly
#     stop and nobody would notice until the dates went stale. Monthly stays
#     inside the window, and each run's own commit resets the clock, so the
#     schedule sustains itself with no human action.
#
#   * It does not open a pull request, unlike annual-content-refresh.yml.
#     That one regenerates prose, which has produced plausible nonsense
#     before and needs a human to read it. This one only advances dates from
#     deterministic generators, so the useful gate is a structural check, not
#     a reviewer - and a PR nobody merges would fail to reset the 60-day
#     clock, defeating the point.
#
# The year rollover is still annual-content-refresh.yml's job in December.

on:
  schedule:
    - cron: '0 5 1 * *'       # 05:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate the city-pair and holiday pages
        run: |
          pip install --quiet holidays
          python tools/gen_city_pairs.py
          python tools/gen_holiday_pages.py
          python tools/bump_assets.py

      - name: Sanity-check the output before it can reach the site
        run: |
          python - <<'PY'
          import os, re, sys
          problems = []
          counts = {}
          for sub in ("time", "holidays"):
              d = os.path.join(".", sub)
              files = set(os.listdir(d))
              counts[sub] = len([f for f in files if f.endswith(".html")])
              words = 0
              for f in files:
                  if not f.endswith(".html"): continue
                  html = open(os.path.join(d, f), encoding="utf-8").read()
                  body = re.sub(r"<(script|style)[^>]*>.*?</\1>", "", html, flags=re.S | re.I)
                  words += len(re.sub(r"<[^>]+>", " ", body).split())
                  for h in re.findall(r'href="([^"]+)"', html):
                      h = h.split("?")[0].split("#")[0]
                      if not h or h.startswith("http") or h.endswith("/"): continue
                      if h.startswith("../"):
                          if not os.path.exists(os.path.join(".", h[3:])):
                              problems.append(f"broken link {sub}/{f} -> {h}")
                      elif h.endswith(".html") and h not in files:
                          problems.append(f"broken link {sub}/{f} -> {h}")
              counts[sub + "_words"] = words

          print(f"time/     {counts['time']:>4} pages, {counts['time_words']:>7,} words")
          print(f"holidays/ {counts['holidays']:>4} pages, {counts['holidays_words']:>7,} words")

          # Guard against a generator that silently produces empty or missing pages.
          if counts["time"] < 200: problems.append(f"only {counts['time']} pages in time/")
          if counts["holidays"] < 200: problems.append(f"only {counts['holidays']} pages in holidays/")
          if counts["time_words"] < 60000: problems.append("time/ word count collapsed")
          if counts["holidays_words"] < 60000: problems.append("holidays/ word count collapsed")

          if problems:
              print(f"\n{len(problems)} problem(s):")
              for p in problems[:10]: print("  " + p)
              sys.exit(1)
          print("\nStructure looks sound.")
          PY

      - name: Commit if anything moved
        run: |
          if git diff --quiet; then
            echo "Nothing changed - the lists are already current."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh generated page content ($(date -u +'%B %Y'))

          Monthly rebuild of the pages under time/ and holidays/ so their
          holiday lists and clock-change dates move forward. Link integrity
          and page counts were checked before this was committed.

          Generated by .github/workflows/refresh-generated-pages.yml."
          git push
          echo "Pushed. GitHub Pages will rebuild automatically."
