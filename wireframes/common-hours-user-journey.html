:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 6px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)

  display: block;

  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {

.form-check:not(.form-switch) .form-check-input:focus-visible {

.form-check:not(.form-switch) .form-check-input:disabled {

}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {

.form-switch .form-check-input:disabled,

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;

  height: 28px;

  padding: 0;

.form-range::-moz-range-track {

.form-range:disabled {

            &lt;label class=&quot;date-control&quot;&gt;&lt;i data-lucide=&quot;calendar-days&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span class=&quot;sr-only&quot;&gt;Meeting date&lt;/span&gt;&lt;input type=&quot;date&quot; value=&quot;2026-09-01&quot; data-date-input&gt;&lt;/label&gt;
            &lt;button type=&quot;button&quot; class=&quot;find-button&quot; data-find&gt;Find common hours&lt;/button&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div data-results&gt;&lt;/div&gt;
      &lt;/main&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;common-hours-journey&#x27;);
      const productWindow = root.querySelector(&#x27;[data-product-window]&#x27;);
      const locationList = root.querySelector(&#x27;[data-location-list]&#x27;);
      const resultsHost = root.querySelector(&#x27;[data-results]&#x27;);
      const note = root.querySelector(&#x27;.stage-note&#x27;);
      const buttons = [...root.querySelectorAll(&#x27;[data-step]&#x27;)];
      const cityData = [
        { name: &#x27;New York&#x27;, zone: &#x27;EDT · UTC−4&#x27;, time: &#x27;10:24 AM&#x27; },
        { name: &#x27;London&#x27;, zone: &#x27;BST · UTC+1&#x27;, time: &#x27;3:24 PM&#x27; },
        { name: &#x27;Tokyo&#x27;, zone: &#x27;JST · UTC+9&#x27;, time: &#x27;11:24 PM&#x27; },
        { name: &#x27;Sydney&#x27;, zone: &#x27;AEST · UTC+10&#x27;, time: &#x27;12:24 AM&#x27; }
      ];
      const states = {
        start: { cities: 2, results: false, chosen: false, phone: false, note: &#x27;Two useful defaults; one clear action.&#x27; },
        cities: { cities: 4, results: true, chosen: false, phone: false, note: &#x27;Up to five cities remain readable without turning into a dashboard.&#x27; },
        choose: { cities: 4, results: true, chosen: true, phone: false, note: &#x27;Selecting one window exposes copy and share actions at the moment they matter.&#x27; },
        mobile: { cities: 3, results: true, chosen: true, phone: true, note: &#x27;The same flow stacks naturally on a phone; no separate mobile interaction model.&#x27; }
      };

      function locationMarkup(city, index, count) {
        return `&lt;div class=&quot;location-field&quot;&gt;&lt;div class=&quot;location-copy&quot;&gt;&lt;div class=&quot;location-name&quot;&gt;&lt;strong&gt;${city.name}&lt;/strong&gt;&lt;span&gt;${index === 0 ? &#x27;Your location&#x27; : city.zone}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;location-time&quot;&gt;&lt;strong&gt;${city.time}&lt;/strong&gt;&lt;span&gt;${index === 0 ? city.zone : &#x27;Local time&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;${count &gt; 2 &amp;&amp; index &gt; 1 ? &#x27;&lt;button class=&quot;remove-location&quot; aria-label=&quot;Remove &#x27; + city.name + &#x27;&quot;&gt;&lt;i data-lucide=&quot;x&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&#x27; : &#x27;&lt;span&gt;&lt;/span&gt;&#x27;}&lt;/div&gt;`;
      }

      let selectedMinutes = 600;
      let selectedDuration = 60;
      let selectedDate = new Date(Date.UTC(2026, 8, 1));

      function dateInputValue(date) {
        return date.toISOString().slice(0, 10);
      }

      function dateLabel(date) {
        return new Intl.DateTimeFormat(&#x27;en-US&#x27;, { weekday: &#x27;long&#x27;, month: &#x27;short&#x27;, day: &#x27;numeric&#x27;, timeZone: &#x27;UTC&#x27; }).format(date);
      }

      function isToday(date) {
        return dateInputValue(date) === &#x27;2026-09-01&#x27;;
      }

      function formatTime(totalMinutes) {
        const normalized = ((totalMinutes % 1440) + 1440) % 1440;
        const hours = Math.floor(normalized / 60);
        const minutes = normalized % 60;
        const displayHour = hours % 12 || 12;
        return `${displayHour}:${String(minutes).padStart(2, &#x27;0&#x27;)} ${hours &lt; 12 ? &#x27;AM&#x27; : &#x27;PM&#x27;}`;
      }

      function resultsMarkup(cities, chosen) {
        const rows = cities.map((city, index) =&gt; {
          const workLeft = [20, 8, 48, 52][index];
          return `&lt;div class=&quot;timeline-row&quot;&gt;&lt;div class=&quot;timeline-city&quot;&gt;&lt;strong&gt;${city.name}&lt;/strong&gt;&lt;span data-city-time=&quot;${index}&quot;&gt;${city.time}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;timeline&quot; role=&quot;button&quot; aria-label=&quot;Choose a meeting time for ${city.name}&quot; data-timeline&gt;&lt;span class=&quot;working&quot; style=&quot;left:${workLeft}%;width:46%&quot;&gt;&lt;/span&gt;${chosen ? &#x27;&lt;span class=&quot;chosen&quot; data-chosen style=&quot;left:40%;width:4.2%&quot;&gt;&lt;/span&gt;&#x27; : &#x27;&#x27;}&lt;/div&gt;&lt;/div&gt;`;
        }).join(&#x27;&#x27;);
        const durationOptions = [[30, &#x27;30 minutes&#x27;], [45, &#x27;45 minutes&#x27;], [60, &#x27;1 hour&#x27;], [90, &#x27;1½ hours&#x27;], [120, &#x27;2 hours&#x27;]].map(([value, label]) =&gt; `&lt;option value=&quot;${value}&quot;${selectedDuration === value ? &#x27; selected&#x27; : &#x27;&#x27;}&gt;${label}&lt;/option&gt;`).join(&#x27;&#x27;);
        const adjuster = chosen ? `&lt;div class=&quot;day-adjuster&quot;&gt;&lt;button data-day=&quot;-1&quot; aria-label=&quot;Previous day&quot;&gt;&lt;i data-lucide=&quot;chevron-left&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;div class=&quot;day-label&quot;&gt;&lt;strong data-date-label&gt;${dateLabel(selectedDate)}&lt;/strong&gt;&lt;span data-date-context&gt;${isToday(selectedDate) ? &#x27;Today&#x27; : &#x27;Meeting date&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;button data-day=&quot;1&quot; aria-label=&quot;Next day&quot;&gt;&lt;i data-lucide=&quot;chevron-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;duration-control&quot;&gt;&lt;label for=&quot;meeting-duration&quot;&gt;&lt;i data-lucide=&quot;timer&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; Duration&lt;/label&gt;&lt;select id=&quot;meeting-duration&quot; data-duration aria-label=&quot;Meeting duration&quot;&gt;${durationOptions}&lt;/select&gt;&lt;/div&gt;&lt;div class=&quot;time-adjuster&quot;&gt;&lt;button class=&quot;nudge-time&quot; data-nudge=&quot;-30&quot; aria-label=&quot;Move 30 minutes earlier&quot;&gt;&lt;i data-lucide=&quot;minus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;label class=&quot;sr-only&quot; for=&quot;meeting-time-slider&quot;&gt;Selected meeting time&lt;/label&gt;&lt;input id=&quot;meeting-time-slider&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;1410&quot; step=&quot;30&quot; value=&quot;${selectedMinutes}&quot; aria-label=&quot;Adjust selected meeting time&quot;&gt;&lt;button class=&quot;nudge-time&quot; data-nudge=&quot;30&quot; aria-label=&quot;Move 30 minutes later&quot;&gt;&lt;i data-lucide=&quot;plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;adjust-hint&quot;&gt;Change the day or duration, then drag to explore the best time&lt;/div&gt;` : &#x27;&#x27;;
        return `&lt;section class=&quot;results&quot; aria-label=&quot;Common meeting times&quot;&gt;&lt;div class=&quot;result-heading&quot;&gt;&lt;div&gt;&lt;span&gt;${chosen ? &#x27;Selected time&#x27; : &#x27;Best overlap&#x27;}&lt;/span&gt;&lt;strong data-selected-summary&gt;${chosen ? &#x27;10:00 AM New York · 3:00 PM London&#x27; : &#x27;Two good windows found&#x27;}&lt;/strong&gt;&lt;span data-meeting-meta&gt;${chosen ? &#x27;Tuesday, Sep 1 · 60 minutes&#x27; : &#x27;Click a window to choose it&#x27;}&lt;/span&gt;&lt;/div&gt;${chosen ? &#x27;&lt;div class=&quot;share-actions&quot;&gt;&lt;button&gt;&lt;i data-lucide=&quot;copy&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; Copy&lt;/button&gt;&lt;button&gt;&lt;i data-lucide=&quot;share-2&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; Share&lt;/button&gt;&lt;/div&gt;&#x27; : &#x27;&#x27;}&lt;/div&gt;${adjuster}&lt;div class=&quot;timeline-list&quot;&gt;${rows}&lt;/div&gt;&lt;div class=&quot;axis&quot;&gt;&lt;span&gt;6 AM&lt;/span&gt;&lt;span&gt;12 PM&lt;/span&gt;&lt;span&gt;6 PM&lt;/span&gt;&lt;span&gt;12 AM&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;&lt;div class=&quot;ad-space&quot; aria-label=&quot;Reserved advertising position&quot;&gt;Reserved responsive ad · below the completed task&lt;/div&gt;`;
      }

      function updateSelection(nextMinutes) {
        selectedMinutes = Math.max(0, Math.min(1410, Math.round(nextMinutes / 30) * 30));
        const offsets = [0, 300, 780, 840];
        const markerLeft = (selectedMinutes / 1440) * 100;
        root.querySelectorAll(&#x27;[data-chosen]&#x27;).forEach(marker =&gt; {
          marker.style.left = `${markerLeft}%`;
          marker.style.width = `${(selectedDuration / 1440) * 100}%`;
        });
        const slider = root.querySelector(&#x27;#meeting-time-slider&#x27;);
        if (slider) slider.value = String(selectedMinutes);
        root.querySelectorAll(&#x27;[data-city-time]&#x27;).forEach(label =&gt; {
          const index = Number(label.dataset.cityTime);
          label.textContent = formatTime(selectedMinutes + offsets[index]);
        });
        const summary = root.querySelector(&#x27;[data-selected-summary]&#x27;);
        if (summary) summary.textContent = `${formatTime(selectedMinutes)} New York · ${formatTime(selectedMinutes + 300)} London`;
        updateMeetingMeta();
      }

      function updateMeetingMeta() {
        const meta = root.querySelector(&#x27;[data-meeting-meta]&#x27;);
        if (meta) meta.textContent = `${dateLabel(selectedDate)} · ${selectedDuration &lt; 60 ? `${selectedDuration} minutes` : selectedDuration === 60 ? &#x27;1 hour&#x27; : `${selectedDuration / 60} hours`}`;
      }

      function updateDate(nextDate) {
        selectedDate = nextDate;
        root.querySelectorAll(&#x27;[data-date-input]&#x27;).forEach(input =&gt; { input.value = dateInputValue(selectedDate); });
        root.querySelectorAll(&#x27;[data-date-label]&#x27;).forEach(label =&gt; { label.textContent = dateLabel(selectedDate); });
        root.querySelectorAll(&#x27;[data-date-context]&#x27;).forEach(label =&gt; { label.textContent = isToday(selectedDate) ? &#x27;Today&#x27; : &#x27;Meeting date&#x27;; });
        updateMeetingMeta();
      }

      function render(step) {
        const state = states[step];
        const cities = cityData.slice(0, state.cities);
        productWindow.classList.toggle(&#x27;phone&#x27;, state.phone);
        locationList.innerHTML = cities.map((city, index) =&gt; locationMarkup(city, index, cities.length)).join(&#x27;&#x27;);
        resultsHost.innerHTML = state.results ? resultsMarkup(cities, state.chosen) : &#x27;&#x27;;
        note.textContent = state.note;
        buttons.forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.step === step)));
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
        if (state.chosen) updateSelection(selectedMinutes);
        updateDate(selectedDate);
      }

      buttons.forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; render(button.dataset.step)));
      root.querySelector(&#x27;[data-add-location]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; render(&#x27;cities&#x27;));
      root.querySelector(&#x27;[data-find]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; render(&#x27;choose&#x27;));
      resultsHost.addEventListener(&#x27;input&#x27;, event =&gt; {
        if (event.target.matches(&#x27;#meeting-time-slider&#x27;)) updateSelection(Number(event.target.value));
      });
      resultsHost.addEventListener(&#x27;click&#x27;, event =&gt; {
        const day = event.target.closest(&#x27;[data-day]&#x27;);
        if (day) {
          const nextDate = new Date(selectedDate);
          nextDate.setUTCDate(nextDate.getUTCDate() + Number(day.dataset.day));
          updateDate(nextDate);
          return;
        }
        const nudge = event.target.closest(&#x27;[data-nudge]&#x27;);
        if (nudge) {
          updateSelection(selectedMinutes + Number(nudge.dataset.nudge));
          return;
        }
        const timeline = event.target.closest(&#x27;[data-timeline]&#x27;);
        if (timeline) {
          if (!root.querySelector(&#x27;#meeting-time-slider&#x27;)) {
            render(&#x27;choose&#x27;);
            return;
          }
          const bounds = timeline.getBoundingClientRect();
          updateSelection(((event.clientX - bounds.left) / bounds.width) * 1440);
        }
      });
      root.addEventListener(&#x27;change&#x27;, event =&gt; {
        if (event.target.matches(&#x27;[data-date-input]&#x27;) &amp;&amp; event.target.value) {
          updateDate(new Date(`${event.target.value}T00:00:00Z`));
        }
        if (event.target.matches(&#x27;[data-duration]&#x27;)) {
          selectedDuration = Number(event.target.value);
          updateSelection(selectedMinutes);
        }
      });
      render(&#x27;start&#x27;);
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;

    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;

  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };

    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

  };

    }

    if (openTimeout != null) {

    }

  };

    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;

    }

    tooltip?.remove();

  };

    const request = ++positionRequest;

      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),

          padding: tooltipGap,

            );
            elements.floating.style.setProperty(

              `${Math.max(0, availableHeight)}px`,
            );

        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;

      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {

    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };

    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }

    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }

  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }

    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);

    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);

  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;

(() =&gt; {

    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
